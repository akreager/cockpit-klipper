# Settings for klipper-mcu-flash.
#
# Plain KEY=value lines. Values are taken literally: no $VARIABLES, but a
# leading ~/ is expanded. Quote values that contain spaces.
#
# klipper-mcu-flash reads this file from -c FILE, else $KLIPPER_MCU_FLASH_CONF,
# else ~/printer_data/config/firmware/mcu-flash.conf.

# Required ---------------------------------------------------------------

# The Klipper checkout to build from (the one the host runs).
KLIPPER_DIR=~/klipper
# The board's Klipper config, as saved by `make menuconfig`. It is copied
# before every build and never modified.
KCONFIG=~/printer_data/config/firmware/my-board.config
# The board's serial device. Use the stable /dev/serial/by-id/ path.
DEVICE=/dev/serial/by-id/usb-Klipper_lpc1768_0123456789ABCDEF-if00
# The board name for Klipper's SD-card flasher; list them with
#   ~/klippy-env/bin/python ~/klipper/scripts/spi_flash/spi_flash.py -l
BOARD=btt-skr-v1.3

# Optional (defaults shown) ----------------------------------------------

# Klipper's Python virtualenv; it runs the flasher.
#KLIPPY_ENV=~/klippy-env
# Klipper's API socket (the -a argument of klippy.py) and log file.
#KLIPPY_SOCKET=~/printer_data/comms/klippy.sock
#KLIPPY_LOG=~/printer_data/logs/klippy.log
# Klipper's systemd service.
#KLIPPER_SERVICE=klipper
# Where builds go. ~/klipper/out is left alone.
#BUILD_DIR=~/.cache/klipper-mcu-flash
# Extra arguments for spi_flash.py, e.g. "-s" for 4 MHz SPI if the SD card
# fails to initialise. The worker always adds -v and keeps that debug log
# in BUILD_DIR/flash.log.
#FLASH_ARGS=
# If set, a build must start at this address, i.e. match the board's
# bootloader (0x4000 for the SKR 1.3's 16 KiB bootloader).
#FLASH_APPLICATION_ADDRESS=0x4000
# The Moonraker power device that switches the printer, e.g. printer for a
# [power printer] section in moonraker.conf. With it, a missing board reads
# either "the printer is off" or "the printer is on, but the board does not
# show up on USB" (which needs a flash by hand). Flashing itself always
# needs the board on USB, whatever the power state.
#POWER_DEVICE=
# Moonraker's address, for POWER_DEVICE.
#MOONRAKER_URL=http://localhost:7125
